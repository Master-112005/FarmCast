services:
  mysql:
    image: mysql:8.4
    container_name: farmcast-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-farmcast_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-farmcast_dev_password}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ml-service:
    build:
      context: ./farmcast-ml
      dockerfile: Dockerfile
    container_name: farmcast-ml
    restart: unless-stopped
    environment:
      FARMCAST_API_KEY: ${ML_SERVICE_API_KEY:-dev-farmcast-ml-key}
      ML_HOST: 0.0.0.0
      ML_PORT: 8000
    ports:
      - "${ML_SERVICE_HOST_PORT:-8000}:8000"
    volumes:
      - ./farmcast-ml/models:/app/models:ro
      - ./farmcast-ml/logs:/app/logs

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmcast-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 5000
      APP_BASE_URL: http://localhost:5000
      API_VERSION: v1
      HEALTH_ROUTE: /health
      DB_DIALECT: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-farmcast_db}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-farmcast_dev_password}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32-characters}
      JWT_EXPIRES_IN: 1h
      JWT_ISSUER: farmcast
      JWT_AUDIENCE: farmcast-users
      JWT_ALGORITHM: HS256
      REFRESH_TOKEN_EXPIRES_IN: 7d
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-dev-refresh-secret-change-me-32-characters}
      DEVICE_JWT_SECRET: ${DEVICE_JWT_SECRET:-dev-device-secret-change-me-32-characters}
      DEVICE_JWT_EXPIRY: 1h
      DEVICE_JWT_ISSUER: farmcast-device
      DEVICE_JWT_AUDIENCE: farmcast-devices
      DEVICE_JWT_ALGORITHM: HS256
      MQTT_BROKER_URL: mqtt://mqtt-broker:1883
      MQTT_REQUIRED: "false"
      MQTT_CLIENT_USERNAME: ${MQTT_CLIENT_USERNAME:-backend-collector}
      MQTT_CLIENT_PASSWORD: ${MQTT_CLIENT_PASSWORD:-dev-mqtt-backend-password}
      MQTT_CLIENT_ID: farmcast-backend-subscriber
      CORS_ORIGIN: http://localhost:3000,http://localhost:5173
      CORS_CREDENTIALS: "false"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_POLLING_MAX: 1200
      UPLOAD_DIR: uploads
      UPLOAD_MAX_SIZE_MB: 5
      UPLOAD_ALLOWED_MIME: image/jpeg,image/png,image/webp
      LOG_LEVEL: info
      HTTP_LOGGING_ENABLED: "true"
      ML_SERVICE_URL: http://ml-service:8000
      ML_SERVICE_AUTH_MODE: api_key
      ML_SERVICE_API_KEY: ${ML_SERVICE_API_KEY:-dev-farmcast-ml-key}
      ML_SERVICE_TIMEOUT_MS: 150000
      MAIL_ENABLED: "false"
      COMMUNITY_CLEANUP_ENABLED: "true"
      COMMUNITY_RETENTION_DAYS: 7
      COMMUNITY_CLEANUP_INTERVAL_MS: 3600000
      COMMUNITY_CLEANUP_MAX_DELETE: 500
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"
    volumes:
      - backend-uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mqtt-broker:
    image: iegomez/mosquitto-go-auth:latest
    container_name: farmcast-mqtt
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MQTT_HOST_PORT:-2883}:1883"
    volumes:
      - ./docker/mosquitto.compose.conf:/etc/mosquitto/mosquitto.conf:ro
      - ./docker/aclfile:/etc/mosquitto/aclfile:ro
      - ./mqtt/data:/var/lib/mosquitto
      - ./mqtt/log:/var/log/mosquitto

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
        VITE_API_ROOT_URL: ${VITE_API_ROOT_URL:-http://localhost:5000}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5000}
    container_name: farmcast-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:80"

volumes:
  mysql-data:
  backend-uploads:
